<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>沈砚 · 记忆网关演示</title>
<meta name="description" content="给 AI 角色用的长期记忆层：记忆自持、写入要人点头、换一个 Base URL 就能接入。">
<meta property="og:type" content="website">
<meta property="og:title" content="沈砚记忆网关｜给 AI 角色用的长期记忆层">
<meta property="og:description" content="记忆自持 · 写入要人点头 · 换一个 Base URL 就能接入">
<meta property="og:image" content="__OG_BASE__/og.png">
<meta property="og:url" content="__OG_BASE__/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<style>
:root{
  --bg:#14130f; --card:#1d1b15; --card2:#262218; --line:#312c22;
  --text:#ece6d8; --muted:#948c7a; --gold:#c8a44a; --green:#7aa06f; --red:#b56b5f;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
.app{height:100dvh;display:flex;flex-direction:column}

/* 顶栏 */
.bar{
  flex:none;height:54px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;border-bottom:1px solid var(--line);
  background:rgba(20,19,15,.92);backdrop-filter:blur(10px);position:relative;z-index:3;
}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who b{font-size:16px;letter-spacing:.04em}
.who .sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;align-items:center;gap:8px;flex:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;transition:.3s}
.dot.ok{background:var(--green);box-shadow:0 0 0 3px rgba(122,160,111,.15)}
.dot.bad{background:var(--red)}

.chip{
  display:none;align-items:center;gap:6px;height:32px;padding:0 12px;
  border-radius:16px;border:1px solid var(--line);background:var(--card);
  color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;
}
.chip em{
  font-style:normal;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--gold);color:#201d14;font-size:11px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;
}
.chip em.zero{background:#3a352a;color:var(--muted)}

/* 主体 */
.main{flex:1;display:flex;min-height:0;position:relative}
.chat{flex:1;display:flex;flex-direction:column;min-width:0}
.log{
  flex:1;overflow-y:auto;padding:18px 16px 8px;display:flex;flex-direction:column;
  gap:9px;scroll-behavior:smooth;
}
.log::-webkit-scrollbar{width:6px}
.log::-webkit-scrollbar-thumb{background:#332e24;border-radius:3px}

.msg{
  max-width:84%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;
  word-break:break-word;font-size:15px;line-height:1.62;
  animation:in .22s cubic-bezier(.22,.8,.3,1) both;
}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.bot{
  align-self:flex-start;background:var(--card);border:1px solid var(--line);
  border-bottom-left-radius:5px;
}
.msg.me{
  align-self:flex-end;background:#2d281f;border:1px solid #3b3427;
  border-bottom-right-radius:5px;
}
.msg.sys{
  align-self:center;background:none;border:none;color:var(--muted);
  font-size:12.5px;max-width:92%;text-align:center;padding:2px 0;
}
.msg.err{align-self:center;color:var(--red);font-size:13px;background:none;border:none}

.msg.sticker{
  align-self:flex-start;background:none;border:none;padding:0;max-width:140px;
}
.msg.sticker img{width:120px;height:120px;display:block;border-radius:14px}
.msg.voice{
  display:flex;align-items:center;gap:9px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px;
  align-self:flex-start;
}
.msg.voice .ic{color:var(--gold);font-size:14px;flex:none}
.msg.voice .pvw{font-size:13.5px;color:var(--muted)}

.wchip{
  display:none;align-items:center;gap:5px;font-size:11px;color:var(--muted);
  border:1px solid var(--line);border-radius:9px;padding:1px 7px;margin-left:8px;
  cursor:help;white-space:nowrap;
}
.wchip.on{display:inline-flex}
.wchip i{width:5px;height:5px;border-radius:50%;background:var(--gold);display:block}

/* 演示模式提示 */
.mockbar{
  flex:none;background:#2a2118;color:#e2c98d;border-bottom:1px solid #4a3a1c;
  font-size:12.5px;padding:7px 14px;text-align:center;letter-spacing:.03em;
}
.mockbar[hidden]{display:none}
.mockbar b{font-weight:600;color:#f0d9a0}

/* 怎么玩 */
.helpchip{
  display:inline-flex;align-items:center;height:30px;padding:0 11px;
  border-radius:15px;border:1px solid var(--line);background:var(--card);
  color:var(--muted);font-size:12.5px;cursor:pointer;font-family:inherit;
}
.helpchip:hover{color:var(--text);border-color:#4a4130}

/* 首次进入的引导 */
.onboard{
  position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:rgba(12,11,8,.72);backdrop-filter:blur(3px);padding:22px;
}
.onboard[hidden]{display:none}
.ob-card{
  width:100%;max-width:400px;background:#1e1b15;border:1px solid #3a3327;
  border-radius:18px;padding:26px 24px 20px;box-shadow:0 24px 60px rgba(0,0,0,.55);
  animation:in .26s cubic-bezier(.22,.8,.3,1) both;
}
.ob-kicker{font-size:11px;letter-spacing:.22em;color:var(--gold);margin-bottom:16px}
.ob-card ol{margin:0 0 16px;padding-left:20px;color:var(--text);font-size:14.5px;line-height:1.9}
.ob-card li{margin-bottom:6px}
.ob-card li b{color:#f2ead9}
.ob-note{font-size:12.5px;color:var(--muted);line-height:1.75;margin:0 0 20px}
.ob-card button{
  width:100%;height:42px;border:none;border-radius:11px;background:var(--gold);
  color:#201d14;font:inherit;font-weight:600;cursor:pointer;
}
.ob-card button:active{transform:scale(.98)}

.typing{display:flex;gap:4px;padding:13px}
.typing i{
  width:5px;height:5px;border-radius:50%;background:var(--muted);
  animation:blink 1.2s infinite both;
}
.typing i:nth-child(2){animation-delay:.18s}
.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* 输入区 */
.composer{
  flex:none;display:flex;gap:8px;align-items:flex-end;padding:10px 14px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--bg);
}
.composer textarea{
  flex:1;resize:none;max-height:120px;min-height:42px;padding:10px 13px;
  border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--text);font:inherit;line-height:1.4;outline:none;
}
.composer textarea:focus{border-color:#4a4130}
.composer button{
  flex:none;height:42px;padding:0 18px;border-radius:12px;border:none;
  background:var(--gold);color:#201d14;font:inherit;font-weight:600;cursor:pointer;
  transition:.15s;
}
.composer button:disabled{opacity:.4;cursor:default}
.composer button:active{transform:scale(.97)}

/* 记忆面板 */
.memory{
  width:330px;flex:none;border-left:1px solid var(--line);background:#191712;
  display:flex;flex-direction:column;min-height:0;
}
.phead{
  flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 10px;font-size:13px;letter-spacing:.06em;color:var(--muted);
}
.phead b{color:var(--text);font-size:13px;font-weight:600;letter-spacing:.08em}
.phead .x{
  display:none;background:none;border:none;color:var(--muted);font-size:22px;
  line-height:1;cursor:pointer;padding:0 4px;
}
.pbody{flex:1;overflow-y:auto;padding:0 14px 14px}
.pbody::-webkit-scrollbar{width:6px}
.pbody::-webkit-scrollbar-thumb{background:#332e24;border-radius:3px}

.sect{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:16px 0 8px}
.sect:first-child{margin-top:4px}
.sect.pending{color:var(--gold)}

.mem{
  border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px;
  background:var(--card);animation:in .3s both;
}
.mem.p{border-color:#4b3e21;background:#221e14}
.mem .kind{font-size:10.5px;color:var(--muted);letter-spacing:.06em;display:block;margin-bottom:3px}
.mem .txt{font-size:13px;line-height:1.55;color:#ded7c7}
.mem .row{display:flex;gap:7px;margin-top:8px}
.mem button{
  flex:1;height:28px;border-radius:7px;border:1px solid var(--line);
  background:var(--card2);color:var(--text);font:inherit;font-size:12.5px;
  cursor:pointer;transition:.15s;
}
.mem button.ok{border-color:#4a5f42;color:#cfe6c6;background:#232a1e}
.mem button.no{border-color:#4f3733;color:#e0c3bd;background:#2a201d}
.mem button:active{transform:scale(.97)}
.pbody .empty{color:#5f5949;font-size:12.5px;padding:6px 2px}

.pfoot{
  flex:none;border-top:1px solid var(--line);padding:9px 14px;
  padding-bottom:calc(9px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-between;align-items:center;
  font-size:11.5px;color:var(--muted);
}
.pfoot a{color:var(--muted);text-decoration:none;border-bottom:1px dotted #4a4437}
.pfoot a:hover{color:var(--gold)}

/* 移动端：面板变底部抽屉 */
@media (max-width:879px){
  .chip{display:inline-flex}
  .memory{
    position:fixed;left:0;right:0;bottom:0;width:auto;height:74dvh;
    border-left:none;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    transform:translateY(102%);transition:transform .28s cubic-bezier(.3,.9,.3,1);
    z-index:9;box-shadow:0 -18px 40px rgba(0,0,0,.5);
  }
  .memory.open{transform:none}
  .phead .x{display:block}
  .log{padding-bottom:2px}
}
@media (min-width:880px){
  .memory{position:relative;transform:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="who">
      <span class="dot" id="dot"></span>
      <b data-i18n="name">沈砚</b>
      <span class="sub" data-i18n="sub">记忆网关 · 演示</span>
      <span class="wchip" id="worldChip" title=""><i></i><span data-i18n="context">实时情境</span></span>
    </div>
    <div class="acts">
      <button class="helpchip" id="langBtn">EN</button>
      <button class="helpchip" id="helpBtn" data-i18n="help">怎么玩</button>
      <button class="chip" id="memBtn"><span data-i18n="gate">记忆闸门</span> <em id="memCount" class="zero">0</em></button>
    </div>
  </header>

  <div class="mockbar" id="mockbar" hidden>
    <b data-i18n="mock_b">演示模式</b> · <span data-i18n="mock_t">回复是固定话术，没有接模型。</span>
  </div>

  <main class="main">
    <section class="chat">
      <div class="log" id="log"></div>
      <form class="composer" id="composer" autocomplete="off">
        <textarea id="input" rows="1" maxlength="500" placeholder="跟他说点什么…" data-i18n-ph="placeholder"></textarea>
        <button type="submit" id="send" data-i18n="send">发送</button>
      </form>
    </section>

    <aside class="memory" id="panel">
      <div class="phead">
        <b data-i18n="gate_title">记忆闸门</b>
        <button class="x" id="closeBtn" aria-label="关闭">×</button>
      </div>
      <div class="pbody" id="pbody"></div>
      <div class="pfoot">
        <span id="quota">—</span>
        <a href="/new" id="newLink" data-i18n="switch">换个会话</a>
      </div>
    </aside>
  </main>
</div>

<div class="onboard" id="onboard" hidden>
  <div class="ob-card">
    <div class="ob-kicker" data-i18n="ob_kicker">这个 demo 怎么看</div>
    <ol>
      <li data-i18n="ob1"><b>随便说一句</b>，比如「今天加班到十点」</li>
      <li data-i18n="ob2">聊两轮，右边会冒出<b>「待审记忆」</b></li>
      <li data-i18n="ob3">点「确认」，再问它同一件事，它记得住</li>
    </ol>
    <p class="ob-note" data-i18n="ob_note">右边那栏是记忆闸门：它想记住的东西进不了正史，得你点头才行。</p>
    <button id="obClose" data-i18n="ob_btn">知道了</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), input = $('input'), sendBtn = $('send');
const panel = $('panel'), pbody = $('pbody'), dot = $('dot');
let busy = false;
const OB_KEY = 'sy_onboard_v1';
const LANG_KEY = 'sy_lang';

const I18N = {
  zh: {
    langBtn: 'EN',
    name: '沈砚', sub: '记忆网关 · 演示', context: '实时情境', help: '怎么玩',
    gate: '记忆闸门', gate_title: '记忆闸门',
    ob_kicker: '这个 demo 怎么看',
    ob1: '<b>随便说一句</b>，比如「今天加班到十点」',
    ob2: '聊两轮，右边会冒出<b>「待审记忆」</b>',
    ob3: '点「确认」，再问它同一件事，它记得住',
    ob_note: '右边那栏是记忆闸门：它想记住的东西进不了正史，得你点头才行。',
    ob_btn: '知道了',
    placeholder: '跟他说点什么…', send: '发送',
    pending: '待审核 · 需要你点头',
    pending_empty: '还没有候选。聊两轮，模型会从这里提出它想记住的事。',
    approved: '已进入正史', approved_empty: '暂无。',
    confirm: '确认', reject: '拒绝',
    quota_left: '本会话还剩 {n} 条', switch: '换个会话',
    mock_b: '演示模式', mock_t: '回复是固定话术，没有接模型。',
    hist_head: '以上是之前的对话', proactive_head: '他先开口的',
    netdown: '连不上本地服务。\n检查服务是否还开着，然后刷新这个页面。',
    generic: '出错了，再试一次。',
    kinds: { core: '核心设定', correction: '纠错', relationship_anchor: '关系锚点',
             fiction_event: '故事内事件', user_preference: '偏好' },
  },
  en: {
    langBtn: '中',
    name: 'Shen Yan', sub: 'Memory Gateway · Demo', context: 'Live context', help: 'How to try',
    gate: 'Memory gate', gate_title: 'Memory Gate',
    ob_kicker: 'How to read this demo',
    ob1: '<b>Say something</b> — e.g. “worked until 10pm again”',
    ob2: 'After two turns, a <b>pending memory</b> appears on the right',
    ob3: 'Hit “Confirm”, then ask again — he remembers it',
    ob_note: 'That panel is the memory gate. Nothing enters the canon until you approve it.',
    ob_btn: 'Got it',
    placeholder: 'Say something…', send: 'Send',
    pending: 'Pending · needs your approval',
    pending_empty: 'Nothing yet. Chat for two turns and the model will propose something worth keeping.',
    approved: 'In canon', approved_empty: 'Nothing yet.',
    confirm: 'Confirm', reject: 'Reject',
    quota_left: '{n} messages left in this session', switch: 'New session',
    mock_b: 'Demo mode', mock_t: 'Canned replies — no model attached.',
    hist_head: 'Earlier in this conversation', proactive_head: 'He spoke first',
    netdown: 'Cannot reach the local service.\nCheck that it is still running, then reload this page.',
    generic: 'Something went wrong. Try again.',
    kinds: { core: 'Core identity', correction: 'Correction', relationship_anchor: 'Relationship anchor',
             fiction_event: 'Story event', user_preference: 'Preference' },
  },
};

let LANG = 'zh';
function t(key){ return (I18N[LANG] && I18N[LANG][key]) || I18N.zh[key] || key; }
function tvar(key, vars){
  let s = t(key);
  for (const k in vars) s = s.replace('{' + k + '}', vars[k]);
  return s;
}
function kindLabel(kind){ return (I18N[LANG].kinds || {}[kind]) || (I18N.zh.kinds || {})[kind] || kind; }

function applyLang(lang){
  LANG = I18N[lang] ? lang : 'zh';
  try { localStorage.setItem(LANG_KEY, LANG); } catch (e) {}
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  const ph = document.querySelector('[data-i18n-ph]');
  if (ph) ph.placeholder = t(ph.dataset.i18nPh);
  $('langBtn').textContent = t('langBtn');
  if (lastMemory) renderMemory(lastMemory);
  paintFooter();
}

function openOnboard(){ $('onboard').hidden = false; }
function closeOnboard(){
  $('onboard').hidden = true;
  try { localStorage.setItem(OB_KEY, '1'); } catch (e) {}
}
let lastQuota = null;
let lastUsage = null;
let lastMemory = null;

function fmtTokens(n){
  if (n == null) return '';
  return n >= 1000 ? (n / 1000).toFixed(1) + 'k tokens' : n + ' tokens';
}

function paintFooter(){
  const parts = [];
  if (lastQuota && lastQuota.session_left != null) parts.push(tvar('quota_left', { n: lastQuota.session_left }));
  if (lastUsage && lastUsage.total_tokens) parts.push(fmtTokens(lastUsage.total_tokens));
  $('quota').textContent = parts.length ? parts.join(' · ') : '—';
}

async function updateUsage(){
  try{
    lastUsage = await api('/api/usage');
    paintFooter();
  }catch(e){ /* 老网关没有这个接口，忽略 */ }
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function atBottom(){
  return log.scrollHeight - log.scrollTop - log.clientHeight < 120;
}
function scrollDown(force){
  if (force || atBottom()) log.scrollTop = log.scrollHeight;
}

function addMsg(text, who, force){
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.textContent = text;
  log.appendChild(el);
  scrollDown(force !== false);
  return el;
}

function addTyping(){
  const el = document.createElement('div');
  el.className = 'msg bot typing';
  el.innerHTML = '<i></i><i></i><i></i>';
  log.appendChild(el);
  scrollDown(true);
  return el;
}

function addSticker(a){
  const el = document.createElement('div');
  el.className = 'msg sticker';
  const img = document.createElement('img');
  img.src = a.url || ('/stickers/' + a.id + '.png');
  img.alt = a.caption || '表情';
  img.loading = 'lazy';
  img.addEventListener('error', () => el.remove());
  img.addEventListener('click', () => window.open(img.src, '_blank'));
  img.style.cursor = 'zoom-in';
  el.appendChild(img);
  log.appendChild(el);
  scrollDown();
  return el;
}

function speak(text){
  try{
    if (!('speechSynthesis' in window) || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 1.02;
    u.pitch = 0.95;
    speechSynthesis.speak(u);
  }catch(e){ /* 浏览器不支持就算了，文字还在 */ }
}

function addVoice(text){
  const el = document.createElement('div');
  el.className = 'msg voice';
  const ic = document.createElement('span');
  ic.className = 'ic';
  ic.textContent = '🔊';
  const pvw = document.createElement('span');
  pvw.className = 'pvw';
  pvw.textContent = text.length > 22 ? text.slice(0, 22) + '…' : text;
  el.append(ic, pvw);
  el.title = text;
  el.addEventListener('click', () => speak(text));
  log.appendChild(el);
  scrollDown();
  return el;
}

async function renderActions(acts, quiet){
  let shown = 0;
  for (const a of acts){
    if (!a || !a.type) continue;
    if (a.type === 'text'){
      const lines = String(a.text || '').split('\n').map(s => s.trim()).filter(Boolean);
      for (let i = 0; i < lines.length; i++){
        addMsg(lines[i], 'bot');
        shown++;
        if (!quiet && i < lines.length - 1) await sleep(240);
      }
    } else if (a.type === 'sticker'){
      addSticker(a);
      shown++;
      if (!quiet) await sleep(180);
    } else if (a.type === 'voice'){
      addVoice(a.text || '');
      speak(a.text || '');
      shown++;
      if (!quiet) await sleep(180);
    }
  }
  if (!shown) addMsg('……', 'bot');
}

function renderHistory(h){
  for (const t of (h.turns || [])){
    if (t.user_text) addMsg(t.user_text, 'me', false);
    const lines = String(t.reply_text || '').split('\n').map(s => s.trim()).filter(Boolean);
    for (const line of lines) addMsg(line, 'bot', false);
  }
  for (const p of (h.proactive || [])){
    const divider = document.createElement('div');
    divider.className = 'msg sys';
    divider.textContent = t('proactive_head') + ' · ' + String(p.created_at || '').slice(5, 16);
    log.appendChild(divider);
    renderActions(p.actions || [], true);
  }
}

function showWorld(context){
  const chip = $('worldChip');
  chip.classList.add('on');
  chip.title = String(context || '').replace(/^【[^】]*】\s*/, '').trim();
}

async function api(path, opts){
  const r = await fetch(path, {
    headers: {'Content-Type':'application/json'},
    ...opts
  });
  if (!r.ok){
    let detail = 'HTTP ' + r.status;
    try { detail = (await r.json()).detail || detail; } catch(e){}
    throw new Error(detail);
  }
  return r.json();
}

// 浏览器原生报错是英文的（Failed to fetch），对普通人没有任何信息量
function friendlyError(e){
  const msg = String((e && e.message) || '');
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(msg)){
    return t('netdown');
  }
  return msg || t('generic');
}

function renderMemory(d){
  lastMemory = d;
  const pending = d.pending || [], approved = d.approved || [];
  $('mockbar').hidden = !d.mock;
  const badge = $('memCount');
  badge.textContent = pending.length;
  badge.className = pending.length ? '' : 'zero';

  let html = '';
  if (pending.length){
    html += '<div class="sect pending">' + t('pending') + '</div>';
    for (const m of pending){
      html += `<div class="mem p" data-id="${m.id}">
        <span class="kind">#${m.id} ${esc(kindLabel(m.kind))}</span>
        <div class="txt">${esc(m.content)}</div>
        <div class="row">
          <button class="ok" data-act="confirm" data-id="${m.id}">${t('confirm')}</button>
          <button class="no" data-act="reject" data-id="${m.id}">${t('reject')}</button>
        </div>
      </div>`;
    }
  } else {
    html += '<div class="sect pending">' + t('gate_title') + '</div>';
    html += '<div class="empty">' + t('pending_empty') + '</div>';
  }

  html += '<div class="sect">' + t('approved') + ' · ' + approved.length + '</div>';
  if (!approved.length){
    html += '<div class="empty">' + t('approved_empty') + '</div>';
  } else {
    for (const m of approved){
      html += `<div class="mem">
        <span class="kind">#${m.id} ${esc(kindLabel(m.kind))}</span>
        <div class="txt">${esc(m.content)}</div>
      </div>`;
    }
  }
  pbody.innerHTML = html;

  lastQuota = d.quota || {};
  paintFooter();
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

async function refresh(){
  try{
    const d = await api('/api/memory');
    renderMemory(d);
    dot.className = 'dot ok';
    return d;
  }catch(e){
    dot.className = 'dot bad';
    return null;
  }
}

async function send(){
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = '';
  input.style.height = 'auto';
  addMsg(text, 'me');
  busy = true;
  sendBtn.disabled = true;

  const t = addTyping();
  try{
    const d = await api('/api/chat', {method:'POST', body: JSON.stringify({text})});
    t.remove();
    await renderActions(Array.isArray(d.actions) ? d.actions : []);
    if (d.context) showWorld(d.context);
    await refresh();
    updateUsage();
    dot.className = 'dot ok';
  }catch(e){
    t.remove();
    addMsg(friendlyError(e), 'err');
  }finally{
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

pbody.addEventListener('click', async ev => {
  const btn = ev.target.closest('button[data-act]');
  if (!btn) return;
  const id = btn.dataset.id, action = btn.dataset.act;
  pbody.querySelectorAll('button').forEach(b => b.disabled = true);
  try{
    const d = await api('/api/memory/' + id, {method:'POST', body: JSON.stringify({action})});
    renderMemory(d);
    if (d.message) addMsg(d.message, 'sys');
  }catch(e){
    addMsg(friendlyError(e), 'err');
    refresh();
  }
});

$('composer').addEventListener('submit', ev => { ev.preventDefault(); send(); });

input.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing){
    ev.preventDefault();
    send();
  }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

$('memBtn').addEventListener('click', () => panel.classList.toggle('open'));
$('closeBtn').addEventListener('click', () => panel.classList.remove('open'));
$('obClose').addEventListener('click', closeOnboard);
$('helpBtn').addEventListener('click', openOnboard);
$('langBtn').addEventListener('click', () => applyLang(LANG === 'zh' ? 'en' : 'zh'));

(function initLang(){
  let saved = '';
  try { saved = localStorage.getItem(LANG_KEY) || ''; } catch (e) {}
  if (!saved){
    const nav = String(navigator.language || 'zh').toLowerCase();
    saved = nav.indexOf('zh') === 0 ? 'zh' : 'en';
  }
  applyLang(saved);
})();

(async function boot(){
  const d = await refresh();
  if (!d){
    addMsg(t('netdown'), 'err');
    return;
  }

  let hist = null;
  try { hist = await api('/api/history'); } catch (e) { /* 老版本网关没有这个接口 */ }
  updateUsage();
  const turns = (hist && hist.turns) || [];
  const proactive = (hist && hist.proactive) || [];

  if (turns.length || proactive.length){
    if (turns.length){
      const head = document.createElement('div');
      head.className = 'msg sys';
      head.textContent = t('hist_head');
      log.insertBefore(head, log.firstChild);
    }
    renderHistory({turns, proactive});
    log.scrollTop = log.scrollHeight;
  } else {
    let seen = '';
    try { seen = localStorage.getItem(OB_KEY) || ''; } catch (e) { seen = '1'; }
    if (!seen) openOnboard();
    const intro = [
      '嗯，来了。',
      '我是沈砚。',
      '旁边那个是记忆闸门——我记住的事都在里面，但要不要进正史，你说了算。',
    ];
    for (const line of intro){
      addMsg(line, 'bot');
      await sleep(520);
    }
    addMsg('先随便说点什么吧。', 'bot');
  }
  input.focus();
})();
</script>
</body>
</html>
