<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>沈砚 · 演示</title>
<style>
body{
  margin:0;min-height:100dvh;background:#14130f;color:#ece6d8;
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.box{width:100%;max-width:320px}
h1{font-size:17px;letter-spacing:.1em;margin:0 0 6px}
p{color:#948c7a;font-size:13px;margin:0 0 22px}
input{
  width:100%;height:44px;padding:0 14px;border-radius:11px;
  border:1px solid #312c22;background:#1d1b15;color:#ece6d8;font:inherit;outline:none;
}
input:focus{border-color:#4a4130}
button{
  width:100%;height:44px;margin-top:10px;border:none;border-radius:11px;
  background:#c8a44a;color:#201d14;font:inherit;font-weight:600;cursor:pointer;
}
</style>
</head>
<body>
<div class="box">
  <h1>沈砚 · 记忆网关</h1>
  <p>演示环境，需要邀请码。</p>
  <form method="get" action="/">
    <input name="k" placeholder="邀请码" autocomplete="off" autofocus>
    <button type="submit">进入</button>
  </form>
</div>
</body>
</html>
